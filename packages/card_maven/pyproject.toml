[project]
name = "card-maven-core"
version = "0.1.0"
description = "Card Maven shared domain: catalog, collection, market, identity, and shared infrastructure"
requires-python = ">=3.12"
dependencies = [
  "sqlalchemy>=2.0.36",
  "psycopg[binary]>=3.2",
  "alembic>=1.14",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "structlog>=24.4",
  "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/card_maven"]
