name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python (lint, types, tests)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: card_maven
          POSTGRES_PASSWORD: card_maven
          POSTGRES_DB: card_maven_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U card_maven" --health-interval 5s
          --health-timeout 3s --health-retries 20
    env:
      CARD_MAVEN_TEST_DATABASE_URL: postgresql+psycopg://card_maven:card_maven@localhost:5432/card_maven_test
      CARD_MAVEN_TEST_S3_ENDPOINT: http://localhost:8333
      CARD_MAVEN_TEST_KAFKA: localhost:9092
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - name: Start SeaweedFS (real S3 policy enforcement tests)
        run: |
          docker run -d --name seaweedfs -p 8333:8333 \
            -v "$PWD/infra/compose/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro" \
            chrislusf/seaweedfs:4.51 server -master.volumeSizeLimitMB=1024 -volume.max=100 \
            -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json
          for i in $(seq 1 90); do
            [ "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8333/)" = "403" ] && exit 0
            sleep 1
          done
          docker logs seaweedfs; exit 1
      - name: Start Kafka (consumer, DLQ round trip)
        run: |
          docker run -d --name kafka -p 9092:9092 apache/kafka:3.9.0
          for i in $(seq 1 90); do
            docker exec kafka /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1 && exit 0
            sleep 1
          done
          docker logs kafka; exit 1
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Typecheck
        run: uv run mypy packages/card_maven/src services/api/src services/workers/src
      - name: Validate config files
        run: uv run card-maven check-config
      - name: Test
        run: |
          set -o pipefail
          uv run pytest --cov --cov-report=term --cov-fail-under=90 2>&1 | tee pytest.log || {
            # Surface each failure as an annotation so it's visible without the raw log.
            grep -E '^(FAILED|ERROR) ' pytest.log | head -20 | sed 's/^/::error title=pytest::/'
            grep -E '^E  ' pytest.log | head -20 | sed 's/^/::error title=pytest detail::/'
            exit 1
          }
      - name: Dependency audit
        run: uv export --frozen --no-dev --no-emit-workspace --format requirements-txt > /tmp/requirements.txt && uvx pip-audit --strict -r /tmp/requirements.txt

  dbt:
    name: dbt (analytics marts)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: card_maven
          POSTGRES_PASSWORD: card_maven
          POSTGRES_DB: card_maven
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U card_maven" --health-interval 5s
          --health-timeout 3s --health-retries 20
    env:
      CARD_MAVEN_DATABASE_URL: postgresql+psycopg://card_maven:card_maven@localhost:5432/card_maven
      CARD_MAVEN_LOG_JSON: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - name: Migrate and load sample market data
        run: |
          uv run alembic -c db/alembic.ini upgrade head
          uv run card-maven seed
          uv run card-maven sync-tracked-sets
          uv run python analytics/dbt/ci/seed_catalog.py
          uv run card-maven request-market-sync --run-now
      - name: dbt build (models, data tests, unit tests)
        working-directory: analytics/dbt
        run: uv sync --frozen && uv run --frozen dbt build --profiles-dir . --fail-fast
      - name: Marts have rows
        run: |
          n=$(PGPASSWORD=card_maven psql -h localhost -U card_maven -d card_maven -tAc "select count(*) from analytics.mart_variant_value")
          [ "$n" -gt 0 ] || { echo "::error::mart_variant_value is empty"; exit 1; }
      - name: Dependency audit
        working-directory: analytics/dbt
        run: uv export --frozen --no-emit-project --format requirements-txt > /tmp/dbt-requirements.txt && uvx pip-audit --strict -r /tmp/dbt-requirements.txt

  web:
    name: Web (lint, types, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/web/package.json  # version from packageManager
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - name: API types match contracts/openapi.json
        run: pnpm check:api
      - run: pnpm coverage
      - run: pnpm build
      - name: Dependency audit
        run: pnpm audit --prod --audit-level high

  helm:
    name: Helm chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: helm lint infra/helm/card-maven -f infra/helm/card-maven/ci-values.yaml --strict
      - name: Render and validate manifests
        run: |
          helm template ci infra/helm/card-maven -f infra/helm/card-maven/ci-values.yaml > rendered.yaml
          for kind in "Deployment 3" "CronJob 3" "ConfigMap 1"; do
            set -- $kind
            n=$(grep -c "^kind: $1$" rendered.yaml || true)
            [ "$n" = "$2" ] || { echo "::error::expected $2 $1, rendered $n"; exit 1; }
          done
          docker run --rm -v "$PWD:/work" ghcr.io/yannh/kubeconform:v0.6.7 -strict -summary /work/rendered.yaml

  terraform:
    name: Terraform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive infra/terraform
      - name: Validate
        run: |
          for dir in infra/terraform/modules/* infra/terraform/envs/*; do
            echo "::group::$dir"
            terraform -chdir="$dir" init -backend=false -input=false
            terraform -chdir="$dir" validate
            echo "::endgroup::"
          done

  images:
    name: Container images
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false  # report every image, not just the first failure
      matrix:
        include:
          - { name: api, file: services/api/Dockerfile, context: . }
          - { name: workers, file: services/workers/Dockerfile, context: . }
          - { name: analytics, file: analytics/dbt/Dockerfile, context: . }
          - { name: web, file: apps/web/Dockerfile, context: apps/web }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: false
          tags: card-maven-${{ matrix.name }}:ci
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
