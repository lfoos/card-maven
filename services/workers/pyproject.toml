[project]
name = "card-maven-workers"
version = "0.1.0"
description = "Card Maven background workers and admin CLI"
requires-python = ">=3.12"
dependencies = [
  "card-maven-core",
  "confluent-kafka>=2.6",
  "click>=8.1",
]

[project.scripts]
card-maven = "card_maven_workers.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/card_maven_workers"]
