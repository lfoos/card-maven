{{- if .Values.outboxRelay.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "card-maven.fullname" . }}-outbox-relay
  labels: {{- include "card-maven.labels" . | nindent 4 }}
    app.kubernetes.io/component: outbox-relay
spec:
  replicas: {{ .Values.outboxRelay.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: outbox-relay
  template:
    metadata:
      labels: {{- include "card-maven.labels" . | nindent 8 }}
        app.kubernetes.io/component: outbox-relay
    spec:
      serviceAccountName: {{ include "card-maven.serviceAccountName" . }}
      terminationGracePeriodSeconds: 30
      containers:
        - name: outbox-relay
          image: {{ include "card-maven.image" (list . .Values.image.workers) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["outbox-relay"]
          {{- include "card-maven.env" . | nindent 10 }}
          {{- include "card-maven.containerSecurity" . | nindent 10 }}
          resources: {{- toYaml .Values.outboxRelay.resources | nindent 12 }}
{{- end }}
