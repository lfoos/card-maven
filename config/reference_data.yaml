# Sports and brands known to the catalog. Seeded idempotently by `make seed`.
# Rows are never deleted by seeding, since cards may already reference them.

sports:
  - { code: baseball,   name: Baseball }
  - { code: basketball, name: Basketball }
  - { code: football,   name: Football }
  - { code: hockey,     name: Hockey }

brands:
  - { slug: bowman,     name: Bowman }
  - { slug: topps,      name: Topps }
  - { slug: panini,     name: Panini }
  - { slug: upper-deck, name: Upper Deck }

# Market data sources and what their terms allow (docs/adr/0009-market-data-licensing.md).
#   analytics     may feed comps, estimated values, dbt marts, and trends
#   display_only  shown as current asks only; deleted when not re-seen within max_age_hours
# Change a source to analytics only with written permission from its owner.
market_sources:
  - { code: manual,      name: Collector-entered sales, license: analytics }
  - { code: fixture,     name: Sample data (dev only),  license: analytics }
  - { code: ebay_browse, name: eBay listings,           license: display_only, max_age_hours: 6 }
